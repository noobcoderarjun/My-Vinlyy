<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Vinyll 🕷️</title>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://www.youtube.com/iframe_api"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- DARK MODE TRANSITION -->
    <div id="theme-transition"></div>

    <!-- SPIDER WEBS -->
    <div class="web web-1"></div>
    <div class="web web-2"></div>

    <!-- ================= HEADER ================= -->

    <header class="top-bar">

        <div class="brand">

            <div class="logo">
                <span class="spider">🕷</span>
                MY VINYLL
            </div>

            <div class="byline">
                BY ARJUNN
            </div>

        </div>


        <nav>
            <a href="#">ABOUT</a>
            <span>•</span>
            <a href="#">VINYLL</a>
        </nav>

    </header>


    <!-- ================= MAIN FRAME ================= -->

    <main>

        <!-- ================= MUSIC PLAYER ================= -->

        <section class="player-section">

            <div class="song-info">

                <div class="now-playing">
                    NOW PLAYING
                </div>

                <h1 id="song-title">
                    Choose a song
                </h1>

                <p id="artist">
                    MY VINYLL
                </p>

            </div>


            <!-- TIMELINE -->

            <div class="timeline-area">

                <span id="current-time">
                    00:00
                </span>

                <input
                    id="timeline"
                    type="range"
                    min="0"
                    max="100"
                    value="0"
                >

                <span id="duration">
                    00:00
                </span>

            </div>


            <!-- CONTROLS -->

            <div class="controls">

                <button id="restart" title="Restart">
                    ↶
                </button>

                <button id="previous" title="Previous">
                    |◀
                </button>

                <button
                    id="play"
                    class="play-button"
                    title="Play / Pause"
                >
                    ▶
                </button>

                <button id="next" title="Next">
                    ▶|
                </button>

                <button id="shuffle" title="Shuffle">
                    ⤨
                </button>

            </div>


            <!-- SEARCH -->

            <div class="search-box">

                <span class="search-icon">
                    🔎
                </span>

                <input
                    id="search"
                    type="text"
                    placeholder="Search any song on YouTube..."
                    autocomplete="off"
                >

                <button id="search-button">
                    SEARCH
                </button>

            </div>


            <!-- SEARCH RESULTS -->

            <div
                id="search-results"
                class="search-results"
            ></div>

        </section>


        <!-- ================= VINYL ================= -->

        <section class="turntable">

            <div
                class="record"
                id="record"
            >

                <div class="record-label">

                    <span>
                        MY<br>
                        VINYLL
                    </span>

                </div>

                <div class="record-hole"></div>

            </div>


            <!-- TONE ARM -->

            <div class="tonearm">

                <div class="tonearm-base"></div>

                <div class="arm">
                    <div class="cartridge"></div>
                </div>

            </div>


            <!-- BOW + ARROW -->

            <div class="arjun-bow">

                <svg
                    viewBox="0 0 500 260"
                    xmlns="http://www.w3.org/2000/svg"
                >

                    <!-- BOW -->

                    <path
                        class="bow-line"
                        d="M55 55
                           Q125 145 250 170
                           Q375 145 445 55"
                    />

                    <path
                        class="bow-line"
                        d="M55 55
                           Q110 95 145 100"
                    />

                    <path
                        class="bow-line"
                        d="M445 55
                           Q390 95 355 100"
                    />


                    <!-- BOW STRING -->

                    <line
                        class="bow-string"
                        x1="55"
                        y1="55"
                        x2="445"
                        y2="55"
                    />


                    <!-- ARROW -->

                    <line
                        class="arrow-line"
                        x1="110"
                        y1="55"
                        x2="390"
                        y2="55"
                    />


                    <!-- ARROW HEAD -->

                    <path
                        class="arrow-head"
                        d="M390 55
                           L365 43
                           M390 55
                           L365 67"
                    />


                    <!-- FEATHERS -->

                    <path
                        class="arrow-feather"
                        d="M125 55
                           L105 40
                           M125 55
                           L105 70"
                    />

                </svg>

                <div class="arjun-text">
                    ARJUNN
                </div>

            </div>

        </section>

    </main>


    <!-- ================= HIDDEN YOUTUBE PLAYER ================= -->

    <section class="youtube-section">

        <div id="youtube-player"></div>

    </section>


    <!-- ================= FOOTER ================= -->

    <footer>

        <button
            id="theme-toggle"
            class="theme-button"
            title="Change theme"
        >
            ◐
        </button>


        <button
            id="youtube-login"
            class="login-button"
        >
            CONNECT YOUTUBE
        </button>

    </footer>


    <script src="script.js"></script>

</body>

</html>
