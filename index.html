<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Vinyll 🕷️🏹</title>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://www.youtube.com/iframe_api"></script>

    <link rel="stylesheet" href="style.css">
</head>


<body>

    <!-- SPIDER WEB DECORATION -->
    <div class="web web-1"></div>
    <div class="web web-2"></div>


    <!-- HEADER -->

    <header class="top-bar">

        <div class="brand">

            <div class="logo">
                <span class="spider">🕷</span>
                MY VINYLL
            </div>

            <div class="byline">
                BY ARJUNN
            </div>

        </div>


        <nav>

            <a href="#">ABOUT</a>

            <span>•</span>

            <a href="#">VINYLL</a>

        </nav>

    </header>



    <!-- MAIN -->

    <main>


        <!-- PLAYER -->

        <section class="player-section">

            <div class="song-info">

                <div class="now-playing">
                    NOW PLAYING
                </div>

                <h1 id="song-title">
                    Choose a song
                </h1>

                <p id="artist">
                    MY VINYLL
                </p>

            </div>



            <!-- TIMELINE -->

            <div class="timeline-area">

                <span id="current-time">
                    00:00
                </span>

                <input
                    id="timeline"
                    type="range"
                    min="0"
                    max="100"
                    value="0"
                >

                <span id="duration">
                    00:00
                </span>

            </div>



            <!-- CONTROLS -->

            <div class="controls">

                <button id="restart">
                    ↶
                </button>

                <button id="previous">
                    |◀
                </button>

                <button
                    id="play"
                    class="play-button"
                >
                    ▶
                </button>

                <button id="next">
                    ▶|
                </button>

                <button id="shuffle">
                    ⤨
                </button>

            </div>



            <!-- SEARCH -->

            <div class="search-box">

                <span class="search-icon">
                    🔎
                </span>

                <input
                    id="search"
                    type="text"
                    placeholder="Search any song on YouTube..."
                    autocomplete="off"
                >

                <button id="search-button">
                    SEARCH
                </button>

            </div>



            <!-- SEARCH RESULTS -->

            <div
                id="search-results"
                class="search-results"
            ></div>

        </section>



        <!-- VINYL + BOW -->

        <section class="turntable">

            <!-- BOW AND ARROW -->

            <div class="bow-decoration">

                <img
                    src="bow.png"
                    alt="Bow and arrow"
                >

            </div>


            <!-- VINYL -->

            <div
                class="record"
                id="record"
            >

                <div class="record-lines"></div>

                <div class="record-label">

                    <span>
                        MY<br>
                        VINYLL
                    </span>

                </div>

                <div class="record-hole"></div>

            </div>


            <!-- TONEARM -->

            <div class="tonearm">

                <div class="tonearm-base"></div>

                <div class="arm">

                    <div class="cartridge"></div>

                </div>

            </div>

        </section>

    </main>



    <!-- YOUTUBE PLAYER -->

    <section class="youtube-section">

        <div class="youtube-title">
            YOUTUBE PLAYER
        </div>

        <div id="youtube-player"></div>

    </section>



    <!-- FOOTER -->

    <footer>

        <button
            id="theme-toggle"
            class="theme-button"
        >
            ◐
        </button>


        <button
            id="youtube-login"
            class="login-button"
        >
            CONNECT YOUTUBE
        </button>

    </footer>


    <script src="script.js"></script>

</body>

</html>
